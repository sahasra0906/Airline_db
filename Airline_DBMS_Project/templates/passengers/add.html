{% extends "base.html" %}
{% block title %}Add Passenger{% endblock %}
{% block content %}
<a href="{{ url_for('passengers.index') }}" class="back-link">← Back to Passengers</a>
<div class="page-hero">
  <div><h1>✚ Add Passenger</h1><p>Register a new passenger in the system.</p></div>
  <div class="hero-badge">👤</div>
</div>
<div class="card">
  <form method="post">
    <div class="form-grid">
      <div class="form-group"><label>First Name *</label><input name="first_name" required placeholder="Rahul"></div>
      <div class="form-group"><label>Last Name *</label><input name="last_name" required placeholder="Sharma"></div>
      <div class="form-group"><label>Email *</label><input name="email" type="email" required placeholder="rahul@email.com"></div>
      <div class="form-group"><label>Phone</label><input name="phone" placeholder="9876543210"></div>
      <div class="form-group"><label>Passport No</label><input name="passport_no" placeholder="P1234567"></div>
      <div class="form-group"><label>Date of Birth</label><input name="date_of_birth" type="date"></div>
      <div class="form-group"><label>Nationality</label>
        <select name="nationality">
          <option value="Indian" selected>Indian</option>
          <option value="Other">Other</option>
        </select>
      </div>
    </div>
    <div style="margin-top:1.5rem">
      <button type="submit" class="btn btn-primary">✚ Add Passenger</button>
      <a href="{{ url_for('passengers.index') }}" class="btn btn-outline" style="margin-left:.8rem">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
